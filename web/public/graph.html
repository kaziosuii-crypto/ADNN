<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADNN 三维网络图</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: rgba(18, 24, 33, 0.92);
    --line: #263041;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 40%, #101a26 0%, #0b0f14 65%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #scene { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #scene.dragging { cursor: grabbing; }
  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; pointer-events: none;
    background: linear-gradient(180deg, rgba(11, 15, 20, 0.9), rgba(11, 15, 20, 0));
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  #stats { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #hint { margin-left: auto; color: var(--muted); font-size: 12px; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(11, 15, 20, 0.86); font-size: 14px; color: var(--text);
    transition: opacity 0.25s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #panel {
    position: fixed; top: 56px; left: 18px; width: 258px;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 12px; color: var(--muted);
    backdrop-filter: blur(8px);
  }
  #search-row { display: flex; gap: 6px; }
  #search-row input { flex: 1; }
  #panel input {
    width: 100%; background: #0f1620; border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); padding: 5px 7px; font-size: 12px;
  }
  #panel input:focus { outline: none; border-color: var(--accent); }
  #panel button {
    background: #1f6feb; color: #fff; border: 0; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  #panel button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .field { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 6px; align-items: center; }
  #buttons { display: flex; gap: 6px; }
  #filter-info { color: var(--muted); font-size: 11px; min-height: 14px; }
  .legend { display: flex; gap: 12px; font-size: 11px; }
  .legend i {
    display: inline-block; width: 12px; height: 3px;
    vertical-align: middle; margin-right: 4px; border-radius: 2px;
  }
  #detail {
    position: fixed; right: 18px; bottom: 18px; width: 310px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; font-size: 12px; line-height: 1.7;
    color: var(--muted); backdrop-filter: blur(8px);
    max-height: 46vh; overflow: auto;
  }
  #detail strong { color: var(--text); font-size: 14px; }
  #detail code { color: #a5d6ff; }
  #detail table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  #detail td { padding: 2px 0; }
  #detail td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #detail .tag { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  #detail .section { margin-top: 8px; color: var(--text); }
  #tooltip {
    position: fixed; z-index: 5; pointer-events: none;
    background: rgba(15, 21, 29, 0.96); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 10px; font-size: 12px; line-height: 1.6;
    color: var(--text); white-space: nowrap; display: none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<header>
  <h1>ADNN · SMCGP 神经元三维网络</h1>
  <div id="stats"></div>
  <div id="hint">拖拽旋转 · 滚轮缩放 · 点击神经元查看类型并“查看 SMCGP” · 双击复位</div>
</header>
<section id="panel">
  <div id="search-row">
    <input id="search" type="search" placeholder="搜索神经元 ID">
    <button id="locate">定位</button>
  </div>
  <!-- 入度 = 该神经元图里 INP 基因的个数；出度 = OUTPUT 基因的个数 -->
  <div class="field"><span>入度</span><input id="f-in-min" type="number" min="0" placeholder="最小"><input id="f-in-max" type="number" min="0" placeholder="最大"></div>
  <div class="field"><span>出度</span><input id="f-out-min" type="number" min="0" placeholder="最小"><input id="f-out-max" type="number" min="0" placeholder="最大"></div>
  <div class="field"><span>基因</span><input id="f-value-min" type="number" min="0" step="1" placeholder="最小"><input id="f-value-max" type="number" min="0" step="1" placeholder="最大"></div>
  <div id="type-filters"><!-- 神经元类型复选框由 graph.js 按 /api/graph 的 types 生成 --></div>
  <div id="buttons"><button id="apply">应用筛选</button><button id="reset" class="ghost">显示全部</button></div>
  <div id="filter-info"></div>
  <div class="legend" id="legend"><!-- 类型图例由 graph.js 生成 --></div>
</section>
<div id="detail">点击神经元查看类型并进入 SMCGP 图</div>
<div id="tooltip"></div>
<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">正在读取数据库…</div>
</div>
<script src="/graph.js"></script>
</body>
</html>
